# ============================================================================
# usdGen CI — M0 scope.
#
# Implements plan/10-build-dependencies-testing.md section 6.2 for the test
# tiers that exist at M0: T0 (build-rule / link-rule checks, gate B-1) and
# T1 (headless scene index: chain order, plugin discovery). The jobs:
#
#   openusd            build OpenUSD v26.08 from the GitHub tag, Release +
#                      Ninja, imaging stack enabled; cache keyed on the
#                      OpenUSD commit + runner arch + recipe epoch; the
#                      install prefix ships to other jobs as a tarball so
#                      executable bits survive artifact round-trips.
#   configure-offline  prove that configuration succeeds with
#                      FETCHCONTENT_FULLY_DISCONNECTED=ON (no network at
#                      configure time).
#   build-release      configure + ninja -j$(nproc) (Release) + usdcat smoke;
#                      uploads the build tree so t0-t1 does not rebuild.
#   t0-t1              ctest -L '^T[01]$' -j8 against the build-release tree.
#   install-check      cmake --install into a scratch prefix; verify the
#                      layout and python3-validate both installed
#                      plugInfo.json files.
#   build-fpfast       nightly/dispatch stub: -DUSDGEN_FP_CONTRACT=fast,
#                      configure + build only. Tolerance tests land in M1
#                      (plan section 5.5 / 8.1); this stub keeps the epsilon
#                      story honest while it costs nothing.
#
# What section 6.2 schedules that is deliberately NOT a GitHub job here:
#
#   * t2-egl (ctest -L T2 through the EGL harness) and t3-xvfb (bin/xvfb.sh
#     then ctest -L T3) are WORKSTATION/MANUAL at M0: GitHub runners have no
#     NVIDIA GPU, and the T3 usdview scripts
#     (bin/run_testusdview_usdgen_*.sh) do not exist until M5. Protocol:
#     docs/workstation-protocol.md.
#   * T4 (MSAA/A2C, Metal/Vulkan, non-NVIDIA drivers, hdPrman parity, 4K
#     interactive) — release criteria only, run by a human at a display
#     (plan section 5.1); by construction never CI. The protocol is
#     docs/workstation-protocol.md; its runner is built at M7
#     (plan/11-roadmap.md section 2.8).
#   * nightly-perf, nightly-sanitize (from M2), with-rigexec — later
#     milestones (plan section 6.2).
#
# Host note: the development host is headless aarch64 Linux; GitHub runners
# are x86_64 ubuntu-24.04. The OpenUSD build below mirrors the workstation
# flow: pin the v26.08 tag, Release + Ninja, and enable what usdGen T1 links
# — usdImaging + usdAppUtils, hdSt (Storm) and hgiGL. Plan section 6.2 names
# these requirements "USD_IMAGING, PXR_HD_STORM, PXR_HGI_GL, usdAppUtils";
# in OpenUSD v26.08 the corresponding CMake options are PXR_BUILD_USD_IMAGING,
# PXR_BUILD_IMAGING and PXR_ENABLE_GL_SUPPORT (all ON by default), and
# build_usd.py --usd-imaging passes exactly those through. build_usd.py is
# used instead of a bare cmake invocation because a clean runner has none of
# the required dependencies (TBB, OpenSubdiv, glvnd/X11 dev headers, boost);
# it downloads, builds and co-installs them into the same prefix, then drives
# cmake with -G Ninja and CMAKE_BUILD_TYPE=Release.
# ============================================================================

name: usdGen

on:
  push:
  pull_request:
  schedule:
    - cron: "30 4 * * *"        # nightly build-fpfast stub
  workflow_dispatch:            # manual build-fpfast stub

jobs:
  # --------------------------------------------------------------------------
  # OpenUSD v26.08 from source (PixarAnimationStudios/OpenUSD @ tag v26.08).
  # Cache key = OS + arch + resolved commit + recipe epoch. The epoch suffix
  # ("usdimg-gl-nopy-v1") identifies the exact build recipe below; bump it to
  # "…-v2" whenever the build_usd.py invocation changes, so two prefixes
  # built from the same commit with different options (python, imaging,
  # MaterialX, GL, shared vs static, dependency versions) never alias one
  # another. Note: actions/cache preserves exec bits; actions/upload-artifact
  # does NOT (files normalize to 0644), hence the tarball below.
  # --------------------------------------------------------------------------
  openusd:
    name: OpenUSD v26.08
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      openusd-sha: ${{ steps.openusd-sha.outputs.sha }}
    steps:
      - name: Checkout OpenUSD @ v26.08
        uses: actions/checkout@v4
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: v26.08
          fetch-depth: 1

      - name: OpenUSD commit (cache key)
        id: openusd-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        # Mirrors OpenUSD's own ubuntu CI (.github/workflows/buildusd.yml in
        # the OpenUSD repo): GLEW + X11 extension headers for the GL/HGI path.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-dev python3-setuptools \
            libglew-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev \
            libgl1-mesa-dev xorg-dev ninja-build

      - name: Restore cached OpenUSD install prefix
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: usd-install
          key: openusd-${{ runner.os }}-${{ runner.arch }}-${{ steps.openusd-sha.outputs.sha }}-usdimg-gl-nopy-v1

      - name: Build OpenUSD (Release, Ninja, usd-imaging)
        # Entry point: build_scripts/build_usd.py (there is no root-level
        # build_usd.py in v26.08).
        # --usd-imaging  -> PXR_BUILD_IMAGING=ON + PXR_BUILD_USD_IMAGING=ON
        #                    (hdSt/Storm, hgiGL via PXR_ENABLE_GL_SUPPORT,
        #                    which defaults ON in 26.08, and usdAppUtils)
        # --no-usdview   -> PXR_BUILD_USDVIEW=OFF (avoids the PySide/PyOpenGL
        #                    requirement; usdAppUtils is not gated by it)
        # --no-python    -> leaner M0 prefix: usdcat is a C++ tool in 26.08
        #                    and the T0/T1 tests are C++; pxr python bindings
        #                    return with the T3 usdview work (M5)
        # --no-materialx -> drop the MaterialX dependency for M0
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 build_scripts/build_usd.py \
            usd-install \
            --build usd-build \
            --generator Ninja \
            --build-variant release \
            --jobs 4 \
            --usd-imaging \
            --no-usdview \
            --no-python \
            --no-tests --no-examples --no-tutorials --no-docs \
            --no-materialx \
            -v

      - name: Save OpenUSD install prefix to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: usd-install
          key: openusd-${{ runner.os }}-${{ runner.arch }}-${{ steps.openusd-sha.outputs.sha }}-usdimg-gl-nopy-v1

      - name: Sanity - required usdGen T1 libraries present
        run: |
          for lib in \
            libusd_usd.so libusd_tf.so libusd_sdf.so libusd_gf.so \
            libusd_usdGeom.so libusd_usdShade.so libusd_sdr.so \
            libusd_usdImaging.so libusd_usdAppUtils.so \
            libusd_hd.so libusd_hdsi.so libusd_hf.so libusd_hdSt.so \
            libusd_hgiGL.so libusd_hgi.so libusd_pxOsd.so libusd_hio.so \
            libusd_trace.so libusd_work.so libusd_js.so libusd_plug.so \
            libusd_ar.so libusd_ts.so
          do
            test -e "usd-install/lib/$lib" || { echo "missing usd-install/lib/$lib"; exit 1; }
          done
          test -x usd-install/bin/usdcat
          test -d usd-install/plugin/usd

      # ------------------------------------------------------------------
      # Artifact transfer as a tarball: actions/upload-artifact normalizes
      # file modes to 0644 on download, which would strip the executable
      # bit from usd-install/bin/usdcat. Tarbing the prefix preserves
      # modes; every consumer job untars it.
      # ------------------------------------------------------------------
      - name: Pack OpenUSD prefix as tarball
        run: tar -C usd-install -cf usd-install.tar .

      - name: Upload OpenUSD prefix tarball
        uses: actions/upload-artifact@v4
        with:
          name: usd-install.tar
          path: usd-install.tar
          retention-days: 5

  # --------------------------------------------------------------------------
  # Offline-configure rule (plan sections 3.2 / 6.2): configuration must
  # succeed with FETCHCONTENT_FULLY_DISCONNECTED=ON, i.e. no network access
  # at configure time. At M0 this is the dedicated proof job;
  # testUsdGenOfflineConfigure (T0) joins the ctest label set once the
  # CMake lane registers it.
  # --------------------------------------------------------------------------
  configure-offline:
    name: configure-offline (FETCHCONTENT_FULLY_DISCONNECTED)
    runs-on: ubuntu-24.04
    needs: openusd
    timeout-minutes: 20
    steps:
      - name: Checkout usdGen
        uses: actions/checkout@v4

      - name: Install configure dependencies
        # Same GL/X11 headers the other configure jobs need: pxrTargets
        # reference OpenGL::GL, and find_package(OpenGL REQUIRED) fails on a
        # stock ubuntu-24.04 runner without libgl1-mesa-dev. ninja-build is
        # required because this job still selects -G Ninja.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev xorg-dev

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Extract OpenUSD prefix
        run: |
          mkdir -p usd-install
          tar -C usd-install -xf usd-install.tar

      - name: Configure (fully disconnected)
        run: |
          cmake -S . -B build-offline -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DUSDGEN_WITH_RIGEXEC=OFF \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON

  # --------------------------------------------------------------------------
  # Release build of usdGen + the usdcat smoke (M0 exit criterion). The
  # build tree is uploaded so t0-t1 runs ctest without rebuilding.
  # --------------------------------------------------------------------------
  build-release:
    name: usdGen build (Release)
    runs-on: ubuntu-24.04
    needs: openusd
    timeout-minutes: 90
    steps:
      - name: Checkout usdGen
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev xorg-dev

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Extract OpenUSD prefix
        run: |
          mkdir -p usd-install
          tar -C usd-install -xf usd-install.tar

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DUSDGEN_WITH_RIGEXEC=OFF

      - name: Build
        # ubuntu-24.04 runners are 4 vCPU / 16GB. ninja -j16 oversubscribes
        # that box compiling OpenUSD-heavy TUs and the runner SIGTERMs the
        # step (exit 143, "interrupted by user") around 80/252.
        run: ninja -C build -j"$(nproc)"

      - name: usdcat smoke (M0 exit criterion)
        # usdcat --flatten on the M0 fixture must run and show the codeless
        # types resolved through Plug. Type-level assertions (IsConcrete,
        # non-empty extent on UsdGenDescription) live in
        # testUsdGenPluginDiscovery; the dlopen/registration proof is
        # docs/prework/m0-usdcat-extent-evidence.md.
        run: |
          PXR_PLUGINPATH_NAME="${PWD}/build/usd/usdGenSchema/resources:${PWD}/build/usd/usdGenImaging/resources:${PWD}/usd-install/plugin/usd" \
          LD_LIBRARY_PATH="${PWD}/usd-install/lib:${LD_LIBRARY_PATH:-}" \
          "${PWD}/usd-install/bin/usdcat" --flatten tests/scenes/scene_empty_groom.usda | tee usdcat-flatten.out
          grep -q 'def UsdGenGroom "Groom"' usdcat-flatten.out
          grep -q 'def UsdGenDescription "Description"' usdcat-flatten.out

      - name: Pack build tree
        run: tar -C build -cf usdgen-build.tar .

      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: usdgen-build.tar
          path: usdgen-build.tar
          retention-days: 5

  # --------------------------------------------------------------------------
  # M0 test suite: ctest -L '^T[01]$' -j8 (plan section 6.2). The -L value is
  # a CMake regex, anchored so a future T10 label never matches.
  #
  # t2-egl (ctest -L T2, GB10 via the EGL harness) and t3-xvfb (bin/xvfb.sh
  # then ctest -L T3) are WORKSTATION/MANUAL at M0: GitHub runners have no
  # NVIDIA GPU, and the T3 usdview scripts
  # (bin/run_testusdview_usdgen_*.sh) do not exist until M5. Protocol:
  # docs/workstation-protocol.md.
  # --------------------------------------------------------------------------
  t0-t1:
    name: ctest -L '^T[01]$'
    runs-on: ubuntu-24.04
    needs: build-release
    timeout-minutes: 30
    steps:
      - name: Checkout usdGen
        uses: actions/checkout@v4

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: usdgen-build.tar

      - name: Extract
        run: |
          mkdir -p usd-install build
          tar -C usd-install -xf usd-install.tar
          tar -C build -xf usdgen-build.tar

      # CMakeLists.txt labels all five gate B-1 tests — the three
      # testUsdGenLinkRule_* tests plus testUsdGenIncludeRule and
      # testUsdGenNoThirdPartyExports — "T0", so this single anchored run
      # covers every M0 test (the former by-name bridge was removed because
      # the labels landed; sol X-3).
      - name: Run T0 + T1 (canonical label run)
        run: ctest --test-dir build -L '^T[01]$' -j8 --output-on-failure

  # --------------------------------------------------------------------------
  # Install tree: cmake --install into a scratch prefix, then verify the
  # layout and python3-validate both installed plugInfo.json files
  # (plan sections 2.3 / 3.4 / 4.3).
  #
  # The full plan-section-6.2 version of this job also runs
  # testUsdGenInstallTree + testUsdGenConsumer + testUsdGenPluginDiscovery
  # against the *installed* tree; those tests are not yet registered in
  # CMakeLists.txt, and testUsdGenConsumer cannot pass until
  # configure_package_config_file() carries PATH_VARS (cmake/usdGenConfig.cmake.in
  # currently leaves usdGen_PLUGIN_DIR / usdGen_LIBRARY_DIR empty). Both are
  # tracked in docs/review/exec-docs-report.md as CMake-lane follow-ups.
  # --------------------------------------------------------------------------
  install-check:
    name: usdGen install layout + plugInfo
    runs-on: ubuntu-24.04
    needs: openusd
    timeout-minutes: 90
    steps:
      - name: Checkout usdGen
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev xorg-dev

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Extract OpenUSD prefix
        run: |
          mkdir -p usd-install
          tar -C usd-install -xf usd-install.tar

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DUSDGEN_WITH_RIGEXEC=OFF

      - name: Build
        run: ninja -C build -j"$(nproc)"

      - name: Install into scratch prefix
        run: cmake --install build --prefix "${GITHUB_WORKSPACE}/usdgen-install"

      # Installed-tree tests (plan section 6.2, sol X-4): ctest -R selects
      # testUsdGenInstallTree + testUsdGenConsumer against the *installed*
      # prefix, passed via USDGEN_INSTALL_PREFIX (env-var name chosen here —
      # docs/review/exec-code-B-report.md does not exist yet, so coordinate
      # with the code lane if the tests land under a different name).
      # PXR_PLUGINPATH_NAME points at the scratch usd/ plugin resources plus
      # the stock OpenUSD plugin dirs; LD_LIBRARY_PATH puts the installed
      # OpenUSD libs and the usdGen build tree first.
      # Until the code lane registers these tests in CMakeLists.txt this step
      # is a guarded no-op: "No tests were found" warns instead of failing,
      # and the same step becomes the real gate automatically once they land.
      - name: Run installed-tree tests
        env:
          USDGEN_INSTALL_PREFIX: "${{ github.workspace }}/usdgen-install"
          PXR_PLUGINPATH_NAME: "${{ github.workspace }}/usdgen-install/lib/usd/usdGenSchema/resources:${{ github.workspace }}/usdgen-install/lib/usd/usdGenImaging/resources:${{ github.workspace }}/usd-install/plugin/usd:${{ github.workspace }}/usd-install/lib/usd"
          LD_LIBRARY_PATH: "${{ github.workspace }}/usd-install/lib:${{ github.workspace }}/build"
        run: |
          OUT="$(ctest --test-dir build -R 'testUsdGen(InstallTree|Consumer)$' --output-on-failure 2>&1)" \
            || { echo "$OUT"; exit 1; }
          if echo "$OUT" | grep -q "No tests were found"; then
            echo "WARNING: testUsdGenInstallTree/testUsdGenConsumer are not yet registered"
            echo "in CMakeLists.txt (code-lane follow-up); this step is a no-op for now."
          else
            echo "$OUT"
          fi

      - name: Verify installed layout
        run: |
          P="${GITHUB_WORKSPACE}/usdgen-install"
          for f in \
            "$P/lib/libusdGen.so" \
            "$P/lib/libusdGenImaging.so" \
            "$P/lib/libusdGenSchema.so" \
            "$P/lib/usd/usdGenSchema/resources/plugInfo.json" \
            "$P/lib/usd/usdGenSchema/resources/generatedSchema.usda" \
            "$P/lib/usd/usdGenImaging/resources/plugInfo.json"
          do
            test -e "$f" || { echo "missing: $f"; exit 1; }
          done
          ls "$P"/include/usdGen* >/dev/null

      - name: Validate installed plugInfo.json files (python3)
        run: |
          python3 - "$GITHUB_WORKSPACE/usdgen-install" <<'PY'
          import json, os, sys

          prefix = os.path.abspath(sys.argv[1])
          failures = []

          def check(cond, msg):
              print(("ok:   " if cond else "FAIL:  ") + msg)
              if not cond:
                  failures.append(msg)

          def load_pluginfo(path, name):
              # plugInfo.json may carry '#' comment lines (schema tool output); strip them
              # before strict JSON parsing.
              with open(path) as f:
                  lines = [l for l in f.readlines() if not l.lstrip().startswith('#')]
              data = json.loads(''.join(lines))          # JSON must parse
              for p in data.get("Plugins", []):
                  if p.get("Name") == name:
                      return p
              return None

          def resolved_library(plug, pluginfo_path):
              # Plug semantics (pxr/base/plug/info.cpp): Root is relative to
              # the directory containing plugInfo.json; LibraryPath is
              # relative to that Root.
              root = os.path.normpath(
                  os.path.join(os.path.dirname(pluginfo_path), plug.get("Root", ".")))
              return os.path.normpath(os.path.join(root, plug.get("LibraryPath", "")))

          schema_pluginfo = os.path.join(prefix, "lib", "usd", "usdGenSchema", "resources", "plugInfo.json")
          imaging_pluginfo = os.path.join(prefix, "lib", "usd", "usdGenImaging", "resources", "plugInfo.json")

          # ---- schema plugin: the codeless types + extent registration ----
          s = load_pluginfo(schema_pluginfo, "usdGenSchema")
          check(s is not None, "schema plugInfo: usdGenSchema plugin entry present")
          if s:
              check(s.get("Type") == "library", "schema plugInfo: Type == 'library'")
              lib = resolved_library(s, schema_pluginfo)
              check(lib == os.path.join(prefix, "lib", "libusdGenSchema.so"),
                    "schema plugInfo: LibraryPath resolves to installed libusdGenSchema.so (%s)" % lib)
              check(os.path.isfile(lib), "schema plugInfo: resolved library exists")
              desc = s.get("Info", {}).get("Types", {}).get("UsdGenDescription", {})
              check(desc.get("implementsComputeExtent") is True,
                    "schema plugInfo: implementsComputeExtent true on UsdGenDescription")
              check("AutoApplyAPISchemas" not in s.get("Info", {}),
                    "schema plugInfo: no auto-applied API schemas (UsdGenMaskAPI is gone)")
              check("UsdGenScatter" in s.get("Info", {}).get("Types", {}),
                    "schema plugInfo: codeless type UsdGenScatter present")

          # ---- imaging plugin: the scene-index chain + adapters ----
          i = load_pluginfo(imaging_pluginfo, "usdGenImaging")
          check(i is not None, "imaging plugInfo: usdGenImaging plugin entry present")
          if i:
              check(i.get("Type") == "library", "imaging plugInfo: Type == 'library'")
              lib = resolved_library(i, imaging_pluginfo)
              check(lib == os.path.join(prefix, "lib", "libusdGenImaging.so"),
                    "imaging plugInfo: LibraryPath resolves to installed libusdGenImaging.so (%s)" % lib)
              check(os.path.isfile(lib), "imaging plugInfo: resolved library exists")
              types = i.get("Info", {}).get("Types", {})
              check("UsdGenGroomSceneIndexPlugin" in types,
                    "imaging plugInfo: UsdGenGroomSceneIndexPlugin entry present")

          if failures:
              print("\n%d failure(s)" % len(failures))
              sys.exit(1)
          print("\nall plugInfo checks passed")
          PY

  # --------------------------------------------------------------------------
  # Nightly stub (plan section 5.5 / 8.1): the -ffp-contract=fast build keeps
  # kernel epsilons honest. M0 ships configure + build only; the tolerance
  # test suite that consumes it lands in M1, so this job runs no ctest.
  # Triggered by the schedule above and by workflow_dispatch.
  # --------------------------------------------------------------------------
  build-fpfast:
    name: usdGen build -DUSDGEN_FP_CONTRACT=fast (nightly stub)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: openusd
    timeout-minutes: 90
    steps:
      - name: Checkout usdGen
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev xorg-dev

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Extract OpenUSD prefix
        run: |
          mkdir -p usd-install
          tar -C usd-install -xf usd-install.tar

      - name: Configure (-DUSDGEN_FP_CONTRACT=fast)
        run: |
          cmake -S . -B build-fpfast -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DUSDGEN_WITH_RIGEXEC=OFF \
            -DUSDGEN_FP_CONTRACT=fast

      - name: Build
        run: ninja -C build-fpfast -j"$(nproc)"
        # No ctest: the fpfast tolerance suite lands in M1 (plan section 5.5).
